[package]
name = "melody-core"
version = "0.1.0"
edition = "2021"
description = "Monophonic melody transcription core for MFS"
repository = "https://github.com/sakusdev/mfs"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
